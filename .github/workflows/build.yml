# Builds the site on every push and publishes a test copy to the gh-pages branch.
# Production (taila.page) will be built by Cloudflare Pages from the same code.
name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          SITE_BASE: /taila/
          SITE_URL: https://i-nura-l.github.io
      - name: Report JavaScript and page sizes
        run: |
          echo "Largest files in the build:"
          find dist -type f \( -name '*.js' -o -name '*.html' -o -name '*.css' \) -printf '%s %p\n' | sort -rn | head -15
          npm ls astro @supabase/supabase-js --depth=0 || true
      - name: Publish test build to the gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Test build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
