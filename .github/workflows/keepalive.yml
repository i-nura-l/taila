# Free Supabase projects pause after a week without requests. One small request a day prevents that.
name: Keep database awake
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "https://ssewcrbyowphbrdjzucf.supabase.co/rest/v1/rpc/search_items" \
            -H "apikey: sb_publishable_L-q4iT8q8MmOfBn-mqgWYw_tyxsZb4u" \
            -H "Content-Type: application/json" -d '{"p_limit":1}' > /dev/null
